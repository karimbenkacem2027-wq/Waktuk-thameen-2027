name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Firebase config (google-services.json)
        run: |
          if [ ! -f google-services.json ]; then
            echo "::error::google-services.json غير موجود في جذر المستودع. نزّله من Firebase وارفعه."
            exit 1
          fi
          if ! grep -q "com.waqtak.thamin" google-services.json; then
            echo "::error::اسم الحزمة داخل google-services.json ليس com.waqtak.thamin"
            exit 1
          fi
          cp google-services.json android/app/google-services.json

      - name: Generate icons
        run: |
          pip install pillow
          python make_icons.py

      - name: Patch app for notifications
        run: python patch_app.py

      - name: Native usage monitor
        run: python setup_native.py

      - name: Add push notifications (FCM)
        run: python patch_push.py

      - name: Add donation card
        run: python patch_donate.py

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waqtak-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
