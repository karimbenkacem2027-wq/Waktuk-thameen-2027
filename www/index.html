const AR = () => S.lang === "ar";
const t = (a, e) => AR() ? a : e;
const $ = s => document.querySelector(s);
const kd = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const day = (k = kd()) => U.days[k] || (U.days[k] = { sec: 0, rem: 0, ses: 0, long: 0, tm: 0 });

function fm(m) {
  m = Math.round(m);
  const h = Math.floor(m / 60), r = m % 60;
  return AR() ? ((h ? h + " س" : "") + (h && r ? " و " : "") + (r || !h ? r + " د" : "")) : ((h ? h + "h " : "") + (r || !h ? r + "m" : "")).trim();
}
function durAr(m) {
  if (m % 60) return m + " دقيقة";
  const h = m / 60;
  return h == 1 ? "ساعة" : h == 2 ? "ساعتان" : h <= 10 ? h + " ساعات" : h + " ساعة";
}
const durEn = m => m % 60 ? m + " minutes" : (m == 60 ? "One hour" : m / 60 + " hours");

/* ---------- STREAK COMPUTATION ---------- */
function getStreak() {
  let streak = 0;
  let d = new Date();
  while (true) {
    const key = kd(d);
    const dayData = U.days[key];
    if (dayData && dayData.sec > 0 && dayData.sec <= S.goalMin * 60) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      if (key === kd(new Date()) && (!dayData || dayData.sec <= S.goalMin * 60)) {
        d.setDate(d.getDate() - 1);
        continue;
      }
      break;
    }
  }
  return streak;
}

/* ---------- SYSTEM NOTIFICATIONS API ENGINE ---------- */
function requestNotificationPermission() {
  if (!("Notification" in window)) {
    toast(t("غير مدعوم", "Not Supported"), t("المتصفح الحالي لا يدعم إشعارات النظام.", "Browser does not support notifications."));
    return;
  }
  Notification.requestPermission().then(permission => {
    if (permission === "granted") {
      sendSystemNotification(t("تم تفعيل الإشعارات بنجاح", "Notifications Enabled"), t("ستتلقى تنبيهات دورية للحفاظ على وقتك وتذكيرك بالذكر.", "You will now receive regular alerts to value your time."));
    }
    render();
  });
}

function sendSystemNotification(title, bodyText) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    if (swRegistration && swRegistration.showNotification) {
      swRegistration.showNotification(title, {
        body: bodyText,
        icon: 'https://placehold.co/192x192/0B6B52/FAF3E0?text=وقتك+ثمين',
        vibrate: S.vib ? [200, 100, 200] : undefined,
        tag: 'time-reminder'
      });
    } else {
      new Notification(title, {
        body: bodyText,
        vibrate: S.vib ? [200, 100, 200] : undefined
      });
    }
  } catch(e) {}
}

function quiet() {
  if (!S.quietOn) return false;
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  const p = x => +x.slice(0, 2) * 60 + +x.slice(3);
  const a = p(S.qs), b = p(S.qe);
  return a <= b ? (m >= a && m < b) : (m >= a || m < b);
}

function fire(kind, min) {
  const d = day(); d.rem++;
  if (window._nat && _nat.usage) return;
  if (quiet()) return;
  const ti = t("وقتك ثمين", "Your Time Is Precious");
  const body = kind === "total" 
    ? (AR() ? `مرّت ${durAr(min)} من وقتك على الشاشة! 🌿\nتذكّر أن الوقت أمانة، فاجعل منه نصيباً للقرآن والعلم.` : `${durEn(min)} passed on your screen! 🌿\nRemember, your time is precious. Give some of it to the Quran and learning.`)
    : (AR() ? `مرّت ${durAr(min)} من الاستخدام المتواصل.\nخذ استراحة من الشاشة، وامنح قلبك بعض الوقت مع الذكر.` : `${durEn(min)} of continuous use have passed.\nTake a break from the screen and refresh your heart.`);
  
  toast(ti, body);
  sendSystemNotification(ti, body);
  try { if (S.vib && navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
  save();
}

function toast(ti, body) {
  const e = $("#toast");
  e.innerHTML = `<b style="color:var(--gold);font-size:16px">${ti}</b>\n<div style="margin-top:4px;font-size:13px">${body}</div><button class="btn sm" style="margin-top:10px" onclick="this.parentNode.style.display='none'">${t("حسناً", "OK")}</button>`;
  e.style.display = "block";
}

setInterval(() => {
  if (document.hidden) return;
  const d = day(); d.sec++; cs++;
  if (cs === 1) d.ses++;
  if (cs > d.long) d.long = cs;

  if (S.totalOn) {
    const m = Math.floor(d.sec / 60 / S.totalMin);
    if (m > d.tm) { d.tm = m; fire("total", m * S.totalMin); }
  }
  if (S.contOn) {
    const m = Math.floor(cs / 60 / S.contMin);
    if (m > cm) { cm = m; fire("cont", m * S.contMin); }
  }
  if (d.sec % 15 === 0) save();
}, 1000);

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); }
  else {
    if (hiddenAt && (Date.now() - hiddenAt) / 60000 >= S.breakMin) { cs = 0; cm = 0; }
    hiddenAt = 0;
  }
});

function nextMin() {
  const a = [];
  if (S.totalOn) { const p = S.totalMin * 60; a.push(p - day().sec % p); }
  if (S.contOn) { const p = S.contMin * 60; a.push(p - cs % p); }
  return a.length ? Math.ceil(Math.min(...a) / 60) : null;
}

async function loadSurah(n) {
  n = Math.min(114, Math.max(1, Number(n)||1));
  const status = document.getElementById('quranStatus'), box = document.getElementById('quranContent');
  if (!status || !box || _quranBusy) return;
  _quranBusy = true; S.qSurah = n; save();
  status.textContent = t('جارٍ تحميل السورة...','Loading surah...'); box.innerHTML = '';
  try {
    const [tx, au] = await Promise.all([
      fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`).then(r=>{if(!r.ok)throw Error('text');return r.json()}),
      fetch(`https://api.alquran.cloud/v1/surah/${n}/ar.alafasy`).then(r=>{if(!r.ok)throw Error('audio');return r.json()})
    ]);
    if (tx.code !== 200 || au.code !== 200) throw Error('api');
    const ayahs = tx.data.ayahs || [], audios = au.data.ayahs || [];
    box.innerHTML = ayahs.map((a,i)=>`<article class="ayah"><div class="ayah-text">${escapeHtml(a.text)}</div><div class="ayah-meta"><span>${t('الآية','Ayah')} ${a.numberInSurah}</span><button class="ayah-play" data-playayah="${escapeAttr(audios[i]?.audio||'')}">▶ ${t('استمع','Listen')}</button></div></article>`).join('');
    status.textContent = `${tx.data.name} • ${tx.data.numberOfAyahs} ${t('آية','ayahs')}`;
    _quranLoaded = n;
  } catch (err) {
    status.textContent = t('تعذر تحميل السورة. تحقق من اتصال الإنترنت ثم أعد المحاولة.','Could not load this surah. Check your internet connection and try again.');
  } finally { _quranBusy = false; }
}
function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

function stats() {

  }
  const mx = Math.max(S.goalMin * 60, ...days.map(a => a[1]), 1);
  const prev = days.slice(0, 6).map(a => a[1]).filter(v => v > 0);
  const avg = prev.length ? prev.reduce((a, b) => a + b) / prev.length : null;
  const streak = getStreak();

  return `<h2>${t("إحصاءات استخدامك","Your usage")}</h2>`
    + natTop()
    + card(`

// Navigation history: Android/browser Back returns to the previous in-app page.
let _waqtakHistoryReady = false;
function initWaqtakNavigation() {
  if (_waqtakHistoryReady) return;
  _waqtakHistoryReady = true;
  history.replaceState({ waqTab: S.tab || "home", waqAbout: false }, "", location.href);
  window.addEventListener("popstate", (event) => {
    const st = event.state || {};
    if (window._about) window._about = 0;
    if (st.waqTab && st.waqTab !== S.tab) S.tab = st.waqTab;
    save();
    render();
  });
}
function waqNavigate(tab) {
  if (!tab || tab === S.tab) return;
  history.pushState({ waqTab: tab, waqAbout: false }, "", location.href);
  S.tab = tab;
}
function waqOpenAbout() {
  history.pushState({ waqTab: S.tab, waqAbout: true }, "", location.href);
  window._about = 1;
}
function waqCloseAbout() {
  if (window._about && history.state && history.state.waqAbout) {
    history.back();
  } else {
    window._about = 0;
    render();
  }
}

    ["limits", ICONS.settings, t("الحدود", "Limits")],
    ["invest", ICONS.invest, t("استثمر", "Invest")]
  ].map(([k, iconSvg, l]) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${iconSvg}<span>${l}</span></button>`).join("");
  if (S.tab === 'quran' && _quranLoaded !== +(S.qSurah||1)) setTimeout(()=>loadSurah(S.qSurah||1), 0);
}

document.addEventListener("click", e => {
  const b=e.target.closest("[data-v3],[data-v3focus]"); if(!b)return;
  if(b.dataset.v3focus){S.focusMinutes=Number(b.dataset.v3focus);save();render();return;}
  if(b.dataset.v3==="startFocus"){v3StartFocus();return;}
  if(b.dataset.v3==="stopFocus"){v3FinishFocus(false);return;}
  if(b.dataset.v3==="exportReport"){v3Export();return;}
  if(b.dataset.v3==="askAI"){v3AskAI();return;}
});
document.addEventListener("change", e=>{
  if(e.target.dataset.v3habit){v3MarkHabit(e.target.dataset.v3habit,e.target.checked);return;}
  if(e.target.dataset.v3challenge){v3MarkChallenge(e.target.dataset.v3challenge,e.target.checked);return;}
  if(e.target.dataset.v3limit){U.appLimits=U.appLimits||{};const v=Number(e.target.value);if(v)U.appLimits[e.target.dataset.v3limit]=v;else delete U.appLimits[e.target.dataset.v3limit];save();v3CheckLimits();}
});
setInterval(()=>{if(S.focusEnd){const el=document.getElementById('v3FocusClock');const left=Math.max(0,Math.ceil((Number(S.focusEnd)-Date.now())/1000));if(el)el.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left===0){v3FinishFocus(true);toast(t('اكتملت جلسة التركيز','Focus session completed'),t('أحسنت، تم حفظ جلستك.','Well done, your session was saved.'));sendSystemNotification(t('اكتملت جلسة التركيز','Focus session completed'),t('أحسنت، تم حفظ جلستك.','Well done, your session was saved.'));}}},1000);

/* ---------- EVENT LISTENERS ---------- */
document.addEventListener("click", e => {
  const delBtn = e.target.closest("[data-delact]");
  if (delBtn) {
    const actId = delBtn.dataset.delact;
    S.customActs = S.customActs.filter(a => a[0] !== actId);
    S.acts = S.acts.filter(id => id !== actId);
    save(); render(); return;
  }

  const b = e.target.closest("[data-tab],[data-set],[data-tog],[data-act],[data-sess],[data-x],[data-playayah],[data-adhkar]");
  if (!b) return;
  const D = b.dataset;

  if (D.playayah) {
    const player = document.getElementById('quranAudio');
    if (player && D.playayah) { player.src = D.playayah; player.style.display = 'block'; player.play().catch(()=>toast(t('تعذر تشغيل الصوت','Audio could not start'),t('اضغط زر التشغيل في مشغل الصوت.','Tap play in the audio player.'))); }
    return;
  }
  if (D.adhkar) {
    U.adhkarCounts = U.adhkarCounts || {}; U.adhkarCounts[D.adhkar] = (U.adhkarCounts[D.adhkar] || 0) + 1; save(); render(); return;
  }
  if (D.tab) { waqNavigate(D.tab); scrollTo(0, 0); }
  else if (D.set) { S[D.set] = isNaN(D.val) || D.val === "" ? D.val : +D.val; }
  else if (D.tog) { S[D.tog] = S[D.tog] ? 0 : 1; }
  else if (D.act) {
    const i = S.acts.indexOf(D.act);
    i < 0 ? S.acts.push(D.act) : S.acts.splice(i, 1);
  }
  else if (D.sess) { sessMin = +D.sess; sessEnd = Date.now() + sessMin * 60000; }
  else if (D.x === "end") sessEnd = 0;
  else if (D.istsec) { istighfarTotalSec = +D.istsec; }
  else if (D.x === "startIstighfar") {
    istighfarCount = 0;
    istighfarEnd = Date.now() + istighfarTotalSec * 1000;
  }
  else if (D.x === "countIstighfar") {
    if (istighfarEnd) {
      istighfarCount++;
      try { if (S.vib && navigator.vibrate) navigator.vibrate(35); } catch(x) {}
    }
  }
  else if (D.x === "endIstighfar") {
    if (istighfarCount > 0) {
      U.totalIstighfarCount = (U.totalIstighfarCount || 0) + istighfarCount;
    }
    istighfarEnd = 0;
  }
  else if (D.x === "about") waqOpenAbout();
  else if (D.x === "closeabout") { waqCloseAbout(); return; }
  else if (D.x === "start") {
    S.done = 1;
    requestNotificationPermission();
  }
  else if (D.x === "requestNotif") {
    if ("Notification" in window && Notification.permission === "granted") {
      sendSystemNotification(t("إشعار تجريبي", "Test Notification"), t("نظام الإشعارات يعمل بنجاح على هاتفك!", "Notifications are working successfully!"));
    } else {
      requestNotificationPermission();
    }
  }
  else if (D.x === "loadQuran") { S.qSurah = +(document.getElementById('qSurahSelect')?.value || 1); _quranLoaded = 0; }
  else if (D.x === "installPWA") {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => { deferredPrompt = null; render(); });
    }
  }
  else if (D.x === "addCustomAct") {
    const input = $("#customActInput");
    if (input && input.value.trim()) {
      const val = input.value.trim();
      const id = "custom_" + Date.now();
      S.customActs.push([id, ICONS.custom, val, val, true]);
      S.acts.push(id);
      input.value = "";
    }
  }

  save(); render();
});

document.addEventListener("change", e => {
  if (e.target.id === 'qSurahSelect') { S.qSurah = +e.target.value; _quranLoaded = 0; save(); loadSurah(S.qSurah); return; }
  const i = e.target.dataset;
  if (!i.in) return;
  S[i.in] = i.num !== undefined ? +e.target.value : e.target.value;
  save(); render();
});

setInterval(() => {
  if (!document.hidden && (S.tab === "home" || S.tab === "stats") && S.done && !window._about) render();
}, 5000);


/* ---------- NATIVE BRIDGE: متابعة استخدام كل التطبيقات (أندرويد) ---------- */
const NB = (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) ? Capacitor.registerPlugin("UsageMonitor") : null;
window._nat = { usage: false, notif: false, top: [] };

function natCard() {
  if (!NB) return card(`<h2>${t("متابعة كل التطبيقات","Track all apps")}</h2><div class="dim">${t("هذه الميزة تعمل في نسخة أندرويد فقط، لأن المتصفح لا يستطيع رؤية استخدامك للتطبيقات الأخرى.","This works in the Android app only; browsers cannot see your use of other apps.")}</div>`);
  const ok = v => v ? t("مفعّل ✓","On ✓") : t("غير مفعّل ✕","Off ✕");
  return card(`<h2>${t("متابعة كل التطبيقات","Track all apps")}</h2>
    <div class="dim" style="text-align:start;width:100%">${t("يصلك التذكير حتى لو لم تفتح هذا التطبيق.","You get reminders even when this app is closed.")}</div>
    <div class="set"><span>${t("إذن الوصول للاستخدام","Usage access")}</span><b>${ok(_nat.usage)}</b></div>
    ${_nat.usage ? "" : `<button class="btn" data-x="natUsage">${t("منح إذن الوصول للاستخدام","Grant usage access")}</button>`}
    <div class="set"><span>${t("إذن الإشعارات","Notifications")}</span><b>${ok(_nat.notif)}</b></div>
    ${_nat.notif ? "" : `<button class="btn" data-x="natNotif">${t("السماح بالإشعارات","Allow notifications")}</button>`}`);
}
function natTop() {
  if (!NB || !_nat.usage || !_nat.top.length) return "";
  const mx = Math.max(..._nat.top.map(a => a.sec), 1);
  return card(`<h2>${t("أكثر التطبيقات استخداماً اليوم","Most used apps today")}</h2>` + _nat.top.map(a =>
    `<div style="width:100%;text-align:start"><div class="set"><span>${a.name}</span><b>${fm(a.sec / 60)}</b></div><div style="height:6px;border-radius:9px;background:var(--soft)"><div style="height:6px;border-radius:9px;background:var(--gold);width:${100 * a.sec / mx}%"></div></div></div>`).join(""));
}

let _natBusy = false;
async function natSync() {
  if (!NB || _natBusy) return;
  _natBusy = true;
  try {
    const p = await NB.hasPermission();
    _nat.usage = p.usage; _nat.notif = p.notif;
    await NB.saveConfig({ cfg: JSON.stringify({ lang: S.lang, totalOn: S.totalOn, totalMin: S.totalMin, contOn: S.contOn, contMin: S.contMin, breakMin: S.breakMin, quietOn: S.quietOn, qs: S.qs, qe: S.qe, vib: S.vib }) });
    if (p.usage) {
      await NB.start();
      const u = await NB.getUsage();
      const d = day(); d.sec = u.sec; _nat.top = u.top || [];
      save(); v3CheckLimits();
    }
    if (!document.hidden && !window._about && (S.tab === "settings" || S.tab === "stats" || S.tab === "home")) render();
  } catch (e) {}
  _natBusy = false;
}
document.addEventListener("click", e => {
  const x = e.target.closest("[data-x]"); if (!x) return;
  if (x.dataset.x === "adminPanel") { window.openWaqtakAdmin?.(); return; }
  if (!NB) return;
  if (x.dataset.x === "natUsage") NB.openUsageSettings();
  if (x.dataset.x === "natNotif") NB.requestNotif().then(() => setTimeout(natSync, 800));
  if (x.dataset.x === "start") setTimeout(natSync, 500);
  setTimeout(natSync, 400);
});
document.addEventListener("change", () => setTimeout(natSync, 400));
document.addEventListener("visibilitychange", () => { if (!document.hidden) natSync(); });
setInterval(() => { if (!document.hidden) natSync(); }, 30000);
natSync();

initWaqtakNavigation();
render();
</script>
<div id="admin-root"></div>
<script type="module" src="./admin/admin.js"></script>
</body>
</html>
